name: Org stats

on:
  schedule:
    - cron: "41 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "stats/snapshot.json"
      - ".github/workflows/org-stats.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: org-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Run tests
        run: npm test

      - name: Load the previous snapshot
        run: |
          if git fetch --depth=1 origin output; then
            git show FETCH_HEAD:stats.json > previous-stats.json || true
          fi

      # ORG_STATS_TOKEN must read every DeveloperLook repository. Without it the charts
      # re-render the newest snapshot, so the README never shows broken images.
      - name: Generate charts
        env:
          ORG_STATS_TOKEN: ${{ secrets.ORG_STATS_TOKEN }}
        run: node scripts/generate.mjs --out dist --previous previous-stats.json --seed stats/snapshot.json

      - name: Publish to the output branch
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init --quiet --initial-branch=output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --quiet --message "Update org stats"
          git push --force --quiet "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output

      # GitHub disables scheduled workflows after 60 days without repository activity.
      - name: Keep the daily schedule enabled
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/org-stats.yml/enable"
