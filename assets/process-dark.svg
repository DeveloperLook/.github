<svg xmlns="http://www.w3.org/2000/svg" width="840" height="196" viewBox="0 0 840 196" role="img" aria-labelledby="how-we-work-title how-we-work-desc"><title id="how-we-work-title">How we work</title><desc id="how-we-work-desc">1. Discovery: 1 week. 2. Scope and proposal: 3 to 5 days. 3. UX and UI design: 2 to 3 weeks. 4. Build sprints: 2 weeks each. 5. QA and launch: 1 week. 6. Support and growth: Ongoing. One project manager, two week sprints and a live staging link at the end of every sprint.</desc><style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><linearGradient id="track" x1="0" x2="1"><stop offset="0" stop-color="#8B65E9"/><stop offset="1" stop-color="#C98500"/></linearGradient></defs><rect x="0.5" y="0.5" width="839" height="195" rx="14" fill="#110C1E" stroke="#261D3B"/><line x1="45" y1="48" x2="698.33" y2="48" stroke="url(#track)" stroke-width="2" opacity="0.55"/><circle cx="45" cy="48" r="17" fill="#1D1633" stroke="#8B65E9" stroke-width="1.5"/><text x="45" y="52.5" fill="#B7A3FC" font-size="12.5" font-weight="700" text-anchor="middle">01</text><text x="28" y="94" fill="#F4F1FF" font-size="14" font-weight="600">Discovery</text><text x="28" y="116" fill="#8C84A6" font-size="12.5">1 week</text><circle cx="175.67" cy="48" r="17" fill="#1D1633" stroke="#8B65E9" stroke-width="1.5"/><text x="175.67" y="52.5" fill="#B7A3FC" font-size="12.5" font-weight="700" text-anchor="middle">02</text><text x="158.67" y="94" fill="#F4F1FF" font-size="14" font-weight="600">Scope and</text><text x="158.67" y="112" fill="#F4F1FF" font-size="14" font-weight="600">proposal</text><text x="158.67" y="134" fill="#8C84A6" font-size="12.5">3 to 5 days</text><circle cx="306.33" cy="48" r="17" fill="#1D1633" stroke="#8B65E9" stroke-width="1.5"/><text x="306.33" y="52.5" fill="#B7A3FC" font-size="12.5" font-weight="700" text-anchor="middle">03</text><text x="289.33" y="94" fill="#F4F1FF" font-size="14" font-weight="600">UX and UI</text><text x="289.33" y="112" fill="#F4F1FF" font-size="14" font-weight="600">design</text><text x="289.33" y="134" fill="#8C84A6" font-size="12.5">2 to 3 weeks</text><circle cx="437" cy="48" r="17" fill="#1D1633" stroke="#8B65E9" stroke-width="1.5"/><text x="437" y="52.5" fill="#B7A3FC" font-size="12.5" font-weight="700" text-anchor="middle">04</text><text x="420" y="94" fill="#F4F1FF" font-size="14" font-weight="600">Build</text><text x="420" y="112" fill="#F4F1FF" font-size="14" font-weight="600">sprints</text><text x="420" y="134" fill="#8C84A6" font-size="12.5">2 weeks each</text><circle cx="567.67" cy="48" r="17" fill="#1D1633" stroke="#8B65E9" stroke-width="1.5"/><text x="567.67" y="52.5" fill="#B7A3FC" font-size="12.5" font-weight="700" text-anchor="middle">05</text><text x="550.67" y="94" fill="#F4F1FF" font-size="14" font-weight="600">QA and</text><text x="550.67" y="112" fill="#F4F1FF" font-size="14" font-weight="600">launch</text><text x="550.67" y="134" fill="#8C84A6" font-size="12.5">1 week</text><circle cx="698.33" cy="48" r="17" fill="#1D1633" stroke="#8B65E9" stroke-width="1.5"/><text x="698.33" y="52.5" fill="#B7A3FC" font-size="12.5" font-weight="700" text-anchor="middle">06</text><text x="681.33" y="94" fill="#F4F1FF" font-size="14" font-weight="600">Support and</text><text x="681.33" y="112" fill="#F4F1FF" font-size="14" font-weight="600">growth</text><text x="681.33" y="134" fill="#8C84A6" font-size="12.5">Ongoing</text><line x1="28" y1="152.5" x2="812" y2="152.5" stroke="#261D3B"/><text x="28" y="177" font-size="13" fill="#B7B0CC" xml:space="preserve"><tspan fill="#F4F1FF" font-weight="600">One project manager</tspan>   ·   <tspan fill="#F4F1FF" font-weight="600">Two week sprints</tspan>   ·   <tspan fill="#F4F1FF" font-weight="600">A live staging link</tspan> at the end of every sprint</text></svg>